events {
    worker_connections 1024;
}

http {
    server {
        listen 443 ssl;
        server_name lab.test *.lab.test;

        # Fixed filenames so the deploy hook's atomic mv never requires a
        # config change: it always replaces these two files in place.
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        location / {
            return 200 "lab.test is up\n";
            add_header Content-Type text/plain;
        }
    }
}
